name: GoSaaS DevSecOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: gosaas
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/gosass
  GO_VERSION: "1.26"


jobs:

  # --------------------------------------------------
  # 1. GITLEAKS - SECRET SCANNING
  # --------------------------------------------------

  gitleaks:
    name: 1. Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------
  # 2. TRIVY - FILESYSTEM SCANNING
  # --------------------------------------------------

  trivy-fs:
    name: 2. Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: gitleaks

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          format: table
          exit-code: "1"
          ignore-unfixed: true


  # --------------------------------------------------
  # 3. GO UNIT TESTING
  # --------------------------------------------------

  unit-test:
    name: 3. Go Unit Tests
    runs-on: ubuntu-latest
    needs: trivy-fs

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Golang
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run Go tests with race detection
        run: go test -race -coverprofile=coverage.out ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error

# --------------------------------------------------
  # 4. SONARQUBE CODE QUALITY ANALYSIS
  # --------------------------------------------------

  sonarqube:
    name: 4. SonarQube Analysis
    runs-on: ubuntu-latest

    needs:
      - gitleaks
      - trivy-fs
      - unit-test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Golang
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: go-coverage

      - name: SonarQube Scan and Quality Gate
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.qualitygate.wait=true