name: GoSaaS DevSecOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: gosaas
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/gosass
  GO_VERSION: "1.26"


jobs:

  # --------------------------------------------------
  # 1. GITLEAKS - SECRET SCANNING
  # --------------------------------------------------

  gitleaks:
    name: 1. Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------
  # 2. TRIVY - FILESYSTEM SCANNING
  # --------------------------------------------------

  trivy-fs:
    name: 2. Trivy Filesystem Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          format: table
          exit-code: "1"
          ignore-unfixed: true
